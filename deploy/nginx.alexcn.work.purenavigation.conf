# PureNavigation 的 nginx 接入片段，目标地址：
#     https://alexcn.work/PureNavigation/main/
#
# 放到 /etc/nginx/conf.d/ 下即可（放 sites-available 的话自己建软链）。
#
# ⚠️ 这是**增量**接入，不是覆盖：这台机器上可能已经跑着别的东西。
#    动手前先看清现状，别把自己的 server 块跟已有的重复定义：
#        sudo nginx -T | grep -n "server_name\|listen"
#
# ⚠️ 关键点是 proxy_pass 结尾那个斜杠：它会把 /PureNavigation/main/ 前缀剥掉，
#    后端看到的就是 / 、/assets/... 、/api/... 。前端因此不需要知道自己在子路径下
#    （vite base 用 './'、API 用相对路径，见 src/lib/api.ts）。

# —— HTTP：只做跳转，除非这台机器上已有别的 80 端口 server 块，那就把本段并进去 ——
server {
    listen      80;
    server_name alexcn.work;

    location = /PureNavigation/main {
        return 301 /PureNavigation/main/;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen      443 ssl;
    http2       on;
    server_name alexcn.work;

    # 用 certbot 签发：sudo certbot --nginx -d alexcn.work
    # 它会把下面两行换成自己的路径（www.alexcn.work 目前不解析，别一起签）。
    ssl_certificate     /etc/letsencrypt/live/alexcn.work/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/alexcn.work/privkey.pem;

    gzip                 on;
    gzip_types           text/css application/javascript application/json image/svg+xml;
    gzip_min_length      1024;

    # 少了这条，浏览器停在 .../main（结尾没斜杠）时相对路径会解析到 /PureNavigation/ 上，
    # 结果就是页面能开、接口和图标全 404。
    location = /PureNavigation/main {
        return 301 /PureNavigation/main/;
    }

    location /PureNavigation/main/ {
        proxy_pass         http://127.0.0.1:8000/;
        proxy_http_version 1.1;

        # server/run.py 里 forwarded_allow_ips=127.0.0.1 只认这一台代理的 X-Forwarded-For，
        # 判别的按 IP 限流才不会被全站共享成 6 次/分钟。
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # 一次判别 = whois + TLS 取证（最坏几十秒）+ 模型回答（60s 超时），
        # 默认 60s 会在这里把正常的长请求掐掉。
        proxy_connect_timeout 10s;
        proxy_send_timeout    150s;
        proxy_read_timeout    150s;
    }
}
