# PureNavigation 的 nginx 接入片段，目标地址：
#     https://alexcn.work/PureNavigation/main/
#
# 用法：拷到 /etc/nginx/conf.d/ 下，nginx -t 通过 reload，然后
#     sudo certbot --nginx -d alexcn.work -d www.alexcn.work --redirect
# certbot 会自己在**这个文件里**加一个 443 的 server 块（证书放
# /etc/letsencrypt/live/alexcn.work/），并配好自动续期。
#
# 这里刻意只写 80：一上来就放个 listen 443 + ssl_certificate 指向还不存在的
# 证书文件，`nginx -t` 会直接失败，反而卡住 certbot 的签发流程。
#
# ⚠️ 这是**增量**接入。动手前先看这台机器上已经有什么，别和已有的 server 块撞：
#     sudo nginx -T | grep -n "server_name\|listen"

server {
    listen      80;
    # www 必须一起写进来：它在云解析里有 A 记录、和 apex 同一个 IP，
    # 少了这个名字，Host: www.alexcn.work 会落到发行版默认站点、返回那个欢迎页。
    server_name alexcn.work www.alexcn.work;

    # 不写 `listen [::]:80`：今天无害，因为 alexcn.work 没有 AAAA 记录，没有访客会走 IPv6 过来。
    # （不是"这台机器绑不上 IPv6"—— 实测 nginx 一直在 [::]:80 上正常监听，来自发行版默认站点。）
    # 但哪天加了 AAAA 记录就必须补这一行：IPv6 的连接只会落到听了 [::]:80 的默认站点，
    # 我们的具名块不接 IPv6 套接字，访客拿到的是那个欢迎页而不是本站。

    # 少了这条，浏览器停在 .../main（结尾没斜杠）时相对路径会解析到 /PureNavigation/ 上，
    # 结果就是页面能开、接口和图标全 404。
    location = /PureNavigation/main {
        return 301 /PureNavigation/main/;
    }

    location /PureNavigation/main/ {
        # 结尾这个斜杠会把 /PureNavigation/main/ 前缀剥掉，后端只看得到 / 、/assets/… 、/api/…，
        # 因此前端不需要知道自己被挂在哪个子路径下（vite base './' + 相对 API 路径）。
        proxy_pass         http://127.0.0.1:8000/;
        proxy_http_version 1.1;

        # server/run.py 里 forwarded_allow_ips=127.0.0.1 只认这台代理的 X-Forwarded-For。
        # 不传的话所有访客在后端眼里都是 127.0.0.1，判别的按 IP 限流会变成全站共享 6 次/分钟。
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # 一次判别 = whois + TLS 取证（最坏几十秒）+ 模型回答（60s 超时）。
        # 默认 60s 会在这里把正常的长请求掐掉。
        proxy_connect_timeout 10s;
        proxy_send_timeout    150s;
        proxy_read_timeout    150s;
    }

    # 这台机器上 alexcn.work 的其余路径不由本站负责。
    # 如果域名下已经有别的服务在跑，把下面这段删掉、由你原有的 server 块接管。
    location / {
        return 404;
    }
}
